<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=0.58" />
		<title>Stardew Valley Save Editor</title>
		<meta
			name="description"
			content="An online save editor for Stardew Valley. Upload your save, then change your appearance, inventory, skills, and more."
		/>

		<meta property="og:title" content="Stardew Valley Save Editor" />
		<meta
			property="og:description"
			content="An online save editor for Stardew Valley. Upload your save, then change your appearance, inventory, skills, and more."
		/>
		<meta
			property="og:url"
			content="https://adam110th.github.io/stardew-save-editor/"
		/>
		<meta property="og:type" content="website" />
		<!-- In the shell, not <svelte:head>: with ssr off that only runs after the page's
		     JavaScript, which link previews and the first favicon request never wait for -->
		<meta
			property="og:image"
			content="https://adam110th.github.io/stardew-save-editor/img/summary.png"
		/>
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/img/favicon.png"
		/>

		<meta name="twitter:card" content="summary" />

		<meta
			name="keywords"
			content="stardew valley, save editor, online editor, game editor, pc, mac, linux, android, ios"
		/>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
